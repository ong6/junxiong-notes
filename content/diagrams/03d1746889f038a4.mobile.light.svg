,522 L220,674 Q220,680 214,680 L22,680 Q16,680 16,674 L16,70 Q16,64 22,64 L68,64" fill="none" stroke="#2a78d6" stroke-opacity="1" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#lalm-head-request)"></path><g data-uipack="label"><rect x="77.31" y="664" width="69.38" height="16" fill="#fffdf9"></rect><text x="112" y="674" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">NEXT YEAR</text></g><g data-uipack="packet" data-kind="request"><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#2a78d6" stroke="#fffdf9" stroke-width="1.5"></rect><animateMotion dur="4s" begin="-1.5s" repeatCount="indefinite" path="M220,522 L220,674 Q220,680 214,680 L22,680 Q16,680 16,674 L16,70 Q16,64 22,64 L60,64" calcMode="linear"></animateMotion></g></g></svg>
