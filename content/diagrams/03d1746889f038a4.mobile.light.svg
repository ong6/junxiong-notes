iew the year</text><text x="112" y="77" text-anchor="start" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">work · resume · direction</text></g></g><g><path data-uipack="connector" data-kind="request" d="M220,106 L220,124" fill="none" stroke="#2a78d6" stroke-opacity="1" stroke-width="1.25" marker-end="url(#lalm-head-request)"></path><g data-uipack="packet" data-kind="request"><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#2a78d6" stroke="#fffdf9" stroke-width="1.5"></rect><animateMotion dur="1.5s" begin="-0.35s" repeatCount="indefinite" path="M220,106 L220,116" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="72" y="128" width="296" height="80" rx="6" fill="#f6f2ea" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><text x="86" y="165" text-anchor="start" font-size="16" font-weight="600" fill="currentColor">Read 10 roles</text><text x="86" y="181" text-anchor="start" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">repeated titles · skills</text></g></g><g><path data-uipack="connector" data-kind="request" d="M220,210 L220,228" fill="none" stroke="#2a78d6" stroke-opacity="1" stroke-width="1.25" marker-end="url(#lalm-head-request)"></path><g data-uipack="packet" data-kind="request"><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#2a78d6" stroke="#fffdf9" stroke-width="1.5"></rect><animateMotion dur="1.5s" begin="-0.7s" repeatCount="indefinite" path="M220,210 L220,220" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="72" y="232" width="296" height="80" rx="6" fill="#f6f2ea" stroke="#1baf7a" stroke-opacity="1" stroke-width="1.25"></rect><g transform="translate(86, 264)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5.5" r="3"></circle><path d="M2.5 14.5c0-3 2.5-5 5.5-5s