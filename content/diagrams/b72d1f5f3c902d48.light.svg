none" aria-hidden="true"></path><g transform="translate(574, 184)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="12" height="8" rx="2"></rect><circle cx="5.5" cy="8" r="1" fill="currentColor"></circle><circle cx="8" cy="8" r="1" fill="currentColor"></circle><circle cx="10.5" cy="8" r="1" fill="currentColor"></circle><path d="M8 1.5V4M8 12v2.5"></path></g><text x="600" y="189" text-anchor="start" font-size="19" font-weight="600" fill="#0f7a55">Model</text> <text x="600" y="207" text-anchor="start" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" fill="currentColor" fill-opacity="0.75">one window</text></g><path data-uipack="connector" data-kind="change" d="M754,192 L852,192" fill="none" stroke="#eb6834" stroke-opacity="1" stroke-width="1.25" marker-end="url(#fp-head-change)"></path><g data-uipack="label"><rect x="782.84" y="170" width="42.32" height="18" fill="#fffdf9"></rect><text x="804" y="182" text-anchor="middle" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">CALL</text></g><g data-uipack="label"><rect x="774.26" y="204" width="59.480000000000004" height="18" fill="#fffdf9"></rect><text x="804" y="216" text-anchor="middle" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">RESULT</text></g><g data-uipack="packet" data-kind="change"><g><path d="M0,-4.8 L4.8,0 L0,4.8 L-4.8,0 Z" fill="#eb6834" stroke="#fffdf9" stroke-width="1.5"></path><animateTransform attributeName="transform" type="scale" dur="1.4s" begin="0s" repeatCount="indefinite" calcMode="spline" values="0;1.2;1;1;0" keyTimes="0;0.12;0.2;0.8;1" keySplines="0.2 0.9 0.3 1;0.4 0 0.6 1;0 0 1 1;0.6 0 0.9 0.4"