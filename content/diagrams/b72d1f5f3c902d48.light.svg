<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 384" width="960" height="341" color="#14110d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Three parts feed text into the model's one context window at different times: the prompt on every request, context such as wiki pages and docs when it is relevant, and a skill's body only when the task matches its description. Tools are the fourth part and the only one the model calls out to: a call goes from the model to an API, a shell or an MCP server, and a result comes back."><style>text{user-select:none}</style><g transform="translate(0,0)"><defs><marker id="fp-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"></path></marker><marker id="fp-head-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#0f7a55"></path></marker><marker id="fp-head-request" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#2a78d6"></path></marker><marker id="fp-head-response" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#0f7a55"></path></marker><marker id="fp-head-change" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#eb6834"></path></marker></defs><g data-uipack="node"><rect x="32" y="32" width="264" height="80" rx="6" fill="#f6f2ea" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 32 32 h 264 v 80 h -264 Z" fill="transparent" stroke="none" aria-hidden="true"></path><g transform="translate(46, 64)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"></rect><path d="M4.5 6l2.5 2-2.5 2M8.5 10.5h3"></path></g><text x="72" y="69" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Prompt</text> <text x="72" y="87" text-anchor="start" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" fill="currentColor" fill-opacity="0.75">system prompt · request</text></g><g data-uipack="node"><rect x="32" y="152" width="264" height="80" rx="6" fill="#f6f2ea" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 32 152 h 264 v 80 h -264 Z" fill="transparent" stroke="none" aria-hidden="true"></path><g transform="translate(46, 184)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.5h5.5L13 5v9.5H4z"></path><path d="M9.5 1.5V5H13M6 8h4M6 11h4"></path></g><text x="72" y="189" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Context</text> <text x="72" y="207" text-anchor="start" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" fill="currentColor" fill-opacity="0.75">wiki pages · docs</text></g><g data-uipack="node"><rect x="32" y="272" width="264" height="80" rx="6" fill="#f6f2ea" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 32 272 h 264 v 80 h -264 Z" fill="transparent" stroke="none" aria-hidden="true"></path><g transform="translate(46, 304)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.5" cy="3.5" r="1.75"></circle><circle cx="4.5" cy="12.5" r="1.75"></circle><circle cx="11.5" cy="5.5" r="1.75"></circle><path d="M4.5 5.25v5.5M11.5 7.25c0 2.5-2 3-4 3.25a3 3 0 0 0-3 .5"></p