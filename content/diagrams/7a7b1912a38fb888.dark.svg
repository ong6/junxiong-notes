<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 456" width="1080" height="456" color="#ece7de" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Six native page sections and their labelled CSS illustrations remain in the document. Intersection Observer callbacks identify which section crosses the viewport centre. Only that chapter mounts a canvas and Three.js renderer. Leaving the chapter unmounts its canvas, cancels its animation frame, disconnects its resize observer and disposes the renderer. Reduced motion renders one static frame. If WebGL is unavailable, the labelled CSS illustration remains."><style>text{user-select:none}</style><g transform="translate(0,0)"><defs><marker id="tsl-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"></path></marker><marker id="tsl-head-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#199e70"></path></marker><marker id="tsl-head-request" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#3987e5"></path></marker><marker id="tsl-head-response" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#199e70"></path></marker><marker id="tsl-head-change" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#d95926"></path></marker></defs><g data-uipack="node"><rect x="40" y="88" width="220" height="88" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><g transform="translate(54, 124)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.5h5.5L13 5v9.5H4z"></path><path d="M9.5 1.5V5H13M6 8h4M6 11h4"></path></g><text x="80" y="129" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Six HTML sections</text><text x="80" y="147" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">native document scroll</text></g><path data-uipack="connector" data-kind="request" d="M262,132 L312,132" fill="none" stroke="#3987e5" stroke-opacity="1" stroke-width="1.25" marker-end="url(#tsl-head-request)"></path><g data-uipack="packet" data-kind="request"><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#3987e5" stroke="#12110f" stroke-width="1.5"></rect><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" path="M262,132 L304,132" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="316" y="88" width="240" height="88" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><text x="330" y="129" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Viewport centre</text><text x="330" y="147" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">observer callback + rects</text></g><path data-uipack="connector" data-kind="change" d="M558,132 L608,132" fill="none" stroke="#d95926" stroke-opacity="1" stroke-width="1.25" marker-end="url(#tsl-head-change)"></path><g data-uipack="packet" data-kind="change"><path d="M0,-4.8 L4.8,0 L0,4.8 L-4.8,0 Z" fill="#d95926" stroke="#12110f" stroke-width="1.5"></path><animateMotion dur="1.6s" begin="-0.6s" repeatCount="indefinite" path="M558,132 L600,132" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="612" y="88" width="220" height="88" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><text x="626" y="129" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Active chapter</text><text x="626" y="147" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">one canvas · one renderer</text></g><path data-uipack="connector" data-kind="response" d="M834,132 L884,132" fill="none" stroke="#199e70" stroke-opacity="1" stroke-width="1.25" marker-end="url(#tsl-head-response)"></path><g data-uipack="packet" data-kind="response"><circle cx="0" cy="0" r="4" fill="#199e70" stroke="#12110f" stroke-width="1.5"></circle><animateMotion dur="1.6s" begin="-1.1s" repeatCount="indefinite" path="M834,132 L876,132" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="888" y="88" width="152" height="88" rx="6" fill="#1b1917" stroke="#199e70" stroke-opacity="1" stroke-width="1.25"></rect><g transform="translate(902, 124)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="12" height="8" rx="2"></rect><circle cx="5.5" cy="8" r="1" fill="currentColor"></circle><circle cx="8" cy="8" r="1" fill="currentColor"></circle><circle cx="10.5" cy="8" r="1" fill="currentColor"></circle><path d="M8 1.5V4M8 12v2.5"></path></g><text x="928" y="129" text-anchor="start" font-size="19" font-weight="600" fill="#199e70">3D object</text><text x="928" y="147" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">route-loaded</text></g><path data-uipack="connector" data-kind="change" d="M784,178 L784,254 Q784,260 778,260 L590,260 Q584,260 584,266 L584,300" fill="none" stroke="#d95926" stroke-opacity="1" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#tsl-head-change)"></path><g data-uipack="label"><rect x="595.37" y="238" width="177.26" height="18" fill="#12110f"></rect><text x="684" y="250" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">CHAPTER LEAVES CENTRE</text></g><g data-uipack="packet" data-kind="change"><path d="M0,-4.8 L4.8,0 L0,4.8 L-4.8,0 Z" fill="#d95926" stroke="#12110f" stroke-width="1.5"></path><animateMotion dur="2.4s" begin="-0.7s" repeatCount="indefinite" path="M784,178 L784,254 Q784,260 778,260 L590,260 Q584,260 584,266 L584,292" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="456" y="304" width="256" height="88" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><text x="470" y="345" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Tear down old canvas</text><text x="470" y="363" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">cancel rAF · dispose renderer</text></g><path data-uipack="connector" data-kind="change" d="M324,178 L324,254 Q324,260 318,260 L250,260 Q244,260 244,266 L244,300" fill="none" stroke="#d95926" stroke-opacity="1" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#tsl-head-change)"></path><g data-uipack="label"><rect x="211.49" y="238" width="145.02" height="18" fill="#12110f"></rect><text x="284" y="250" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">WEBGL UNAVAILABLE</text></g><g data-uipack="packet" data-kind="change"><path d="M0,-4.8 L4.8,0 L0,4.8 L-4.8,0 Z" fill="#d95926" stroke="#12110f" stroke-width="1.5"></path><animateMotion dur="2.2s" begin="-1.2s" repeatCount="indefinite" path="M324,178 L324,254 Q324,260 318,260 L250,260 Q244,260 244,266 L244,292" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="116" y="304" width="256" height="88" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><text x="130" y="345" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Labelled CSS fallback</text><text x="130" y="363" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">mounted for every chapter</text></g></g></svg>
