<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 512" width="1080" height="512" color="#ece7de" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="A production voice agent. The caller reaches telephony over the phone network or an app, then a speech layer handles turn detection and barge-in, speech to text, and the voice; one duplex model such as GPT-Live-1 can replace all three. The speech layer passes text to a reasoning model inside the harness. The reasoning model reaches five harness parts: tools and APIs that issue the refund or book the slot, caller context from the CRM and past calls, guardrails for policy and identity checks, a warm handoff to a human, and evals that replay simulated calls against the whole thing."><style>text{user-select:none}</style><g transform="translate(0,0)"><defs><marker id="vh-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"></path></marker><marker id="vh-head-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#199e70"></path></marker><marker id="vh-head-request" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#3987e5"></path></marker><marker id="vh-head-response" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#199e70"></path></marker><marker id="vh-head-change" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#d95926"></path></marker></defs><g data-uipack="node"><rect x="16" y="216" width="136" height="64" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7"