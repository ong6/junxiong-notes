<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" color="#14110d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Defects in agent-written code enter on the left as seven packets and pass through six walls in order: the agent's self-check, deterministic CI, multi-agent AI review, security review, human approval by risk tier, and the merge queue with flags and staged rollout. Each wall has holes, and each stops one defect, so the count falls from seven to one; the counts are illustrative, not measured. Anthropic estimates the AI review would have caught about a third of past incident bugs. A seventh layer, a daily eval of past incidents, checks the AI reviewer itself. The one defect that slips through every wall reaches rollback, where a flag is switched off without a deploy. An eighth layer, containment, frames the whole flow: sandboxes and narrow identities limit what any agent can do. In the Claude Code repository from June to September 2026, merged pull requests more than doubled while the reverted share fell by more than 40%."><style>text{user-select:none}</style><g transform="translate(0,0)"><defs><marker id="vs-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"></path></marker><marker id="vs-head-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#0f7a55"></path></marker><marker id="vs-head-request" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#2a78d6"></path></marker><marker id="vs-head-response" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#0f7a55"></