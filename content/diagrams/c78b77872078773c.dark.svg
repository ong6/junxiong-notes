<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 320" width="1080" height="320" color="#ece7de" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="A fixed prefix of tool schemas, system prompt and instructions is read from cache and feeds the loop of file reads, edits and tool output, which grows with each tool call and is re-sent every turn. When the window fills, compaction discards detail chosen for you, and a dashed edge back to the prefix shows the cached prefix dying."><style>text{user-select:none}</style><g transform="translate(0,0)"><defs><marker id="cl-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"></path></marker><marker id="cl-head-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#199e70"></path></marker><marker id="cl-head-request" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#3987e5"></path></marker><marker id="cl-head-response" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#199e70"></path></marker><marker id="cl-head-change" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#d95926"></path></marker></defs><g data-uipack="node"><rect x="48" y="96" width="232" height="88" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><g transform="translate(62, 132)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.5h5.5L13 5v9.5H4z"></path><path d="M9.5 1.5V5H13M6 8h4M6 11h4"></path></g><text x="88" y="137" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Fixed prefix</text><text x="88" y="155" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">schemas · prompt · from cache</text></g><path data-uipack="connector" data-kind="request" d="M282,140 L340,140" fill="none" stroke="#3987e5" stroke-opacity="1" stroke-width="1.25" marker-end="url(#cl-head-request)"></path><g data-uipack="packet" data-kind="request"><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#3987e5" stroke="#12110f" stroke-width="1.5"></rect><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" path="M282,140 L332,140" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="344" y="96" width="232" height="88" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><g transform="translate(358, 132)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"></rect><path d="M4.5 6l2.5 2-2.5 2M8.5 10.5h3"></path></g><text x="384" y="137" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">The loop</text><text x="384" y="155" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">reads · edits · tool output</text></g><path data-uipack="connector" data-kind="change" d="M520,94 L520,54 Q520,48 514,48 L406,48 Q400,48 400,54 L400,92" fill="none" stroke="#d95926" stroke-opacity="1" stroke-width="1.25" marker-end="url(#cl-head-change)"></path><g data-uipack="label"><rect x="304.1" y="27" width="311.8" height="19" fill="#12110f"></rect><text x="460" y="40" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">EACH TOOL CALL · RE-SENT EVERY TURN</text></g><g data-uipack="packet" data-kind="change"><path d="M0,-4.8 L4.8,0 L0,4.8 L-4.8,0 Z" fill="#d95926" stroke="#12110f" stroke-width="1.5"></path><animateMotion dur="2s" begin="-0.7s" repeatCount="indefinite" path="M520,94 L520,54 Q520,48 514,48 L406,48 Q400,48 400,54 L400,84" calcMode="linear"></animateMotion></g><path data-uipack="connector" data-kind="change" d="M578,140 L636,140" fill="none" stroke="#d95926" stroke-opacity="1" stroke-width="1.25" marker-end="url(#cl-head-change)"></path><g data-uipack="packet" data-kind="change"><path d="M0,-4.8 L4.8,0 L0,4.8 L-4.8,0 Z" fill="#d95926" stroke="#12110f" stroke-width="1.5"></path><animateMotion dur="1.6s" begin="-0.4s" repeatCount="indefinite" path="M578,140 L628,140" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="640" y="96" width="200" height="88" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><g transform="translate(654, 132)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2 14.5 13.5h-13z"></path><path d="M8 6.5v3.5M8 12.25h.01"></path></g><text x="680" y="137" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Compaction</text><text x="680" y="155" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">when the window fills</text></g><path data-uipack="connector" data-kind="change" d="M842,140 L900,140" fill="none" stroke="#d95926" stroke-opacity="1" stroke-width="1.25" marker-end="url(#cl-head-change)"></path><g data-uipack="packet" data-kind="change"><path d="M0,-4.8 L4.8,0 L0,4.8 L-4.8,0 Z" fill="#d95926" stroke="#12110f" stroke-width="1.5"></path><animateMotion dur="1.6s" begin="-1s" repeatCount="indefinite" path="M842,140 L892,140" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="904" y="96" width="152" height="88" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25" stroke-dasharray="4 4"></rect><text x="980" y="137" text-anchor="middle" font-size="19" font-weight="600" fill="currentColor">Detail discarded</text><text x="980" y="155" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">chosen for you</text></g><path data-uipack="connector" data-kind="change" d="M740,186 L740,242 Q740,248 734,248 L170,248 Q164,248 164,242 L164,188" fill="none" stroke="#d95926" stroke-opacity="1" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#cl-head-change)"></path><g data-uipack="label"><rect x="374.22" y="231" width="155.56" height="19" fill="#12110f"></rect><text x="452" y="244" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">CACHE PREFIX DIES</text></g><g data-uipack="packet" data-kind="change"><path d="M0,-4.8 L4.8,0 L0,4.8 L-4.8,0 Z" fill="#d95926" stroke="#12110f" stroke-width="1.5"></path><animateMotion dur="3s" begin="-1.3s" repeatCount="indefinite" path="M740,186 L740,242 Q740,248 734,248 L170,248 Q164,248 164,242 L164,196" calcMode="linear"></animateMotion></g></g></svg>
