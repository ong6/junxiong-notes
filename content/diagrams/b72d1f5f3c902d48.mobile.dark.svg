onospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">every request</text></g><g data-uipack="node"><rect x="24" y="96" width="272" height="56" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 24 96 h 272 v 56 h -272 Z" fill="transparent" stroke="none" aria-hidden="true"></path><text x="160" y="121" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor">Context</text> <text x="160" y="140" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">read when relevant</text></g><g data-uipack="node"><rect x="24" y="176" width="272" height="56" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 24 176 h 272 v 56 h -272 Z" fill="transparent" stroke="none" aria-hidden="true"></path><text x="160" y="201" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor">Skills</text> <text x="160" y="220" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">body loads on match</text></g><path data-uipack="connector" data-kind="request" d="M298,44 L322,44 Q328,44 328,50 L328,278 Q328,284 322,284 L300,284" fill="none" stroke="#3987e5" stroke-opacity="1" stroke-width="1.25" marker-end="url(#fpm-head-request)"></path><path data-uipack="connector" data-kind="request" d="M298,124 L322,124 Q328,124 328,130 L328,278 Q328,284 322,284 L300,284" fill="none" stroke="#3987e5" stroke-opacity="1" stroke-width="1.25" marker-end="url(#fpm-head-request)"></path><path data-uipack="connector" data-kind="request" d="M298,204 L322,204 Q328,204 328,210 L328,278 Q328,284 322,284 L300,284" fill="none" stroke="#3987e5" stroke-opacity="1" stroke-width="1.25" marker-end="url(#fpm-head-request)"></path><g data-uipack="packet" data-kind="request"><g><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#3987e5" stroke="#12110f" stroke-width="1.5"></rect><animateTransform attributeName="transform" type="scale" dur="2.2s" begin="0s" repeatCount="indefinite" calcMode="spline" values="0;1.2;1;1;0" keyTimes="0;0.076;0.127;0.855;1" keySplines="0.2 0.9 0.3 1;0.4 0 0.6 1;0 0 1 1;0.6 0 0.9 0.4"></animateTransform></g><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M302,44 L322,44 Q328,44 328,50 L328,278 Q328,284 322,284 L308,284" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="24" y="256" width="272" height="56" rx="6" fill="#1b1917" stroke="#199e70" stroke-opacity="1" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 24 256 h 272 v 56 h -272 Z" fill="transparent" stroke="none" aria-hidden="true"></path><text x="160" y="281" text-anchor="middle" font-size="16" font-weight="600" fill="#199e70">Model</text> <text x="160" y="300" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">one window</text></g><path data-uipack="connector" data-kind="change" d="M160,314 L160,364" fill="none" stroke="#d95926" stroke-opacity="1" stroke-width="1.25" marker-end="url(#fpm-head-change)"></path><g data-uipack="label"><rect x="168" y="333" width="128.12" height="19" fill="#12110f"></rect><text x="172" y="346" text-anchor="start" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">CALL · RESULT</text></g><g data-uipack="packet" data-kind="change"><g><path d="M0,-4.8 L4.8,0 L0,4.8 L-4.8,0 Z" fill="#d95926" stroke="#12110f" stroke-width="1.5"></path><animateTransform attributeName="transform" type="scale" dur="1.2s" begin="0s" repeatCount="indefinite" calcMode="spline" values="0;1.2;1;1;0" keyTimes="0;0.12;0.2;0.8;1" keySplines="0.2 0.9 0.3 1;