<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 472" width="400" height="472" color="#ece7de" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Users send requests to a router, then a scheduler with a queue and token budget, then a forward pass that loops once per step, producing one token for every sequence in the batch. The first token back costs queue wait plus prefill."><style>text{user-select:none}</style><g transform="translate(0,0)"><defs><marker id="spm-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"></path></marker><marker id="spm-head-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#199e70"></path></marker><marker id="spm-head-request" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#3987e5"></path></marker><marker id="spm-head-response" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#199e70"></path></marker><marker id="spm-head-change" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#d95926"></path></marker></defs><g data-uipack="node"><rect x="24" y="24" width="248" height="64" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 24 24 h 248 v 64 h -248 Z" fill="transparent" stroke="none" aria-hidden="true"></path><g transform="translate(38, 48)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5.5" r="3"></circle><path d="M2.5 14.5c0-3 2.5-5 5.5-5s5.5 2 5.5 5"></path></g><text x="64" y="53" text-anchor="start" font-size="16" font-weight="600" fill="currentColor">Users</text><text x="64" y="71" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">N requests</text></g><path data-uipack="connector" data-kind="request" d="M148,90 L148,116" fill="none" stroke="#3987e5" stroke-opacity="1" stroke-width="1.25" marker-end="url(#spm-head-request)"></path><g data-uipack="packet" data-kind="request"><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#3987e5" stroke="#12110f" stroke-width="1.5"></rect><animateMotion dur="0.9s" begin="0s" repeatCount="indefinite" path="M148,94 L148,108" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="24" y="120" width="248" height="64" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 24 120 h 248 v 64 h -248 Z" fill="transparent" stroke="none" aria-hidden="true"></path><text x="38" y="149" text-anchor="start" font-size="16" font-weight="600" fill="currentColor">Router</text><text x="38" y="167" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">picks a replica</text></g><path data-uipack="connector" data-kind="request" d="M148,186 L148,212" fill="none" stroke="#3987e5" stroke-opacity="1" stroke-width="1.25" marker-end="url(#spm-head-request)"></path><g data-uipack="node"><rect x="24" y="216" width="248" height="64" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 24 216 h 248 v 64 h -248 Z" fill="transparent" stroke="none" aria-hidden="true"></path><g transform="translate(38, 240)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"></circle><path d="M8 4.5V8l2.5 1.5"></path></g><text x="64" y="245" text-anchor="start" font-size="16" font-weight="600" fill="currentColor">Scheduler</text><text x="64" y="263" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">queue · token budget</text></g><path data-uipack="connector" data-kind="request" d="M148,282 L148,308" fill="none" stroke="#3987e5" stroke-opacity="1" stroke-width="1.25" marker-end="url(#spm-head-request)"></path><g data-uipack="node"><rect x="24" y="312" width="248" height="80" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 24 312 h 248 v 80 h -248 Z" fill="transparent" stroke="none" aria-hidden="true"></path><g transform="translate(38, 344)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="12" height="8" rx="2"></rect><circle cx="5.5" cy="8" r="1" fill="currentColor"></circle><circle cx="8" cy="8" r="1" fill="currentColor"></circle><circle cx="10.5" cy="8" r="1" fill="currentColor"></circle><path d="M8 1.5V4M8 12v2.5"></path></g><text x="64" y="349" text-anchor="start" font-size="16" font-weight="600" fill="currentColor">Forward pass</text><text x="64" y="367" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">batch B · B tokens out</text></g><path data-uipack="connector" data-kind="change" d="M274,336 L314,336 Q320,336 320,342 L320,362 Q320,368 314,368 L276,368" fill="none" stroke="#d95926" stroke-opacity="1" stroke-width="1.25" marker-end="url(#spm-head-change)"></path><g data-uipack="packet" data-kind="change"><path d="M0,-4.8 L4.8,0 L0,4.8 L-4.8,0 Z" fill="#d95926" stroke="#12110f" stroke-width="1.5"></path><animateMotion dur="1.4s" begin="0s" repeatCount="indefinite" path="M278,336 L314,336 Q320,336 320,342 L320,362 Q320,368 314,368 L284,368" calcMode="linear"></animateMotion></g><g data-uipack="label"><rect x="20" y="411" width="329.16" height="19" fill="#12110f"></rect><text x="24" y="424" text-anchor="start" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">LOOP: ONE TOKEN PER SEQUENCE PER STEP</text></g><g data-uipack="label"><rect x="20" y="435" width="303.12" height="19" fill="#12110f"></rect><text x="24" y="448" text-anchor="start" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">FIRST TOKEN BACK = QUEUE + PREFILL</text></g></g></svg>
