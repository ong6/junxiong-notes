<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 880" width="440" height="880" color="#14110d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Three harness architectures. One closed loop, Claude Code: every surface drives one closed binary in which the agent loop, with its subagents, and the Claude-only model adapter are fused; extensions such as hooks, skills, plugins and mods attach from outside. Plugin kernel, DeepSeek Harness: a preset, a YAML list of plugins such as Minimal, Standard or PTC, composes the Cordis kernel, and the agent loop, the model adapters, the tools and the surfaces all plug into it as plugins, the loop no more privileged than the rest. Gateway daemon, Hermes Agent: chat platforms reach an always-on gateway that owns sessions, cron and delivery and runs a fresh agent loop for each turn, or hands the turn to Codex's engine; the loop calls any model with a fallback chain, keeps memory and the skills it writes, and runs commands on a chosen backend such as Docker or SSH."><style>text{user-select:none}</style><g transform="translate(0,0)"><defs><marker id="ham-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"></path></marker><marker id="ham-head-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#0f7a55"></path></marker><marker id="ham-head-request" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#2a78d6"></path></marker><marker id="ham-head-response" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#0f7a55"></path></marker><marker id="ham-head-change" markerWidth="8" marker