<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="1080" height="520" color="#14110d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Sequence: the agent sends its own credential plus the user's subject token to the auth broker. The broker downscopes to one audience with a TTL in minutes and returns a short-lived token carrying an act claim. The agent presents only that token to the internal service, which checks audience, scope and expiry."><style>text{user-select:none}</style><g transform="translate(0,0)"><defs><marker id="te-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"></path></marker><marker id="te-head-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#1baf7a"></path></marker><marker id="te-head-request" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#2a78d6"></path></marker><marker id="te-head-response" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#1baf7a"></path></marker><marker id="te-head-change" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#eb6834"></path></marker></defs><g data-uipack="lane"><text x="180" y="20" text-anchor="middle" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".08em" fill="currentColor">AGENT</text></g><g data-uipack="lane"><text x="540" y="20" text-anchor="middle" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".08em" fill="currentColor">AUTH BROKER</text></g><g data-uipack="lane"><text x="900" y="20" text-anchor="middle" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".08em" fill="currentColor">INTERNAL SERVICE</text></g><g data-uipack="node"><rect x="76" y="32" width="208" height="48" rx="6" fill="#f6f2ea" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><g transform="translate(90, 48)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5" r="3"></circle><path d="M2.5 14.5c0-3 2.5-5 5.5-5s5.5 2 5.5 5"></path><path d="M8 1v1"></path></g><text x="116" y="62.65" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Agent</text></g><g data-uipack="node"><rect x="436" y="32" width="208" height="48" rx="6" fill="#f6f2ea" stroke="#1baf7a" stroke-opacity="1" stroke-width="1.25"></rect><g transform="translate(450, 48)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="10" height="7.5" rx="1.5"></rect><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path><circle cx="8" cy="10.75" r="1" fill="currentColor"></circle></g><text x="476" y="62.65" text-anchor="start" font-size="19" font-weight="600" fill="#1baf7a">Auth broker</text></g><g data-uipack="node"><rect x="796" y="32" width="208" height="48" rx="6" fill="#f6f2ea" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><g transform="translate(810, 48)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="12" height="12" rx="2"></rect><path d="M5 8h6M8 5v6"></path></g><text x="836" y="62.65" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Internal service</text></g><path data-uipack="connector" d="M180,88 L180,500" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.25" stroke-dasharray="5 4"></path><path data-uipack="connector" d="M540,88 L540,500" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.25" stroke-dasharray="5 4"></path><path data-uipack="connector" d="M900,88 L900,500" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.25" stroke-dasharray="5 4"></path><path data-uipack="connector" data-kind="request" d="M180,144 L538,144" fill="none" stroke="#2a78d6" stroke-opacity="1" stroke-width="1.25" marker-end="url(#te-head-request)"></path><g data-uipack="label"><rect x="218.36" y="123" width="283.28" height="17" fill="#fffdf9"></rect><text x="360" y="134" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">OWN CREDENTIAL + USER&#x27;S SUBJECT TOKEN</text></g><g data-uipack="packet" data-kind="request"><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#2a78d6" stroke="#fffdf9" stroke-width="1.5"></rect><animateMotion dur="2s" begin="0s" repeatCount="indefinite" path="M180,144 L530,144" calcMode="linear"></animateMotion></g><path data-uipack="connector" data-kind="change" d="M540,192 L598,192 Q604,192 604,198 L604,234 Q604,240 598,240 L542,240" fill="none" stroke="#eb6834" stroke-opacity="1" stroke-width="1.25" marker-end="url(#te-head-change)"></path><g data-uipack="label"><rect x="612" y="199" width="253.52" height="17" fill="#fffdf9"></rect><text x="616" y="210" text-anchor="start" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">DOWNSCOPE: AUDIENCE = ONE SERVICE</text></g><g data-uipack="label"><rect x="612" y="217" width="112.16" height="17" fill="#fffdf9"></rect><text x="616" y="228" text-anchor="start" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">TTL IN MINUTES</text></g><g data-uipack="packet" data-kind="change"><path d="M0,-4.8 L4.8,0 L0,4.8 L-4.8,0 Z" fill="#eb6834" stroke="#fffdf9" stroke-width="1.5"></path><animateMotion dur="2s" begin="-0.5s" repeatCount="indefinite" path="M540,192 L598,192 Q604,192 604,198 L604,234 Q604,240 598,240 L550,240" calcMode="linear"></animateMotion></g><path data-uipack="connector" data-kind="response" d="M540,296 L182,296" fill="none" stroke="#1baf7a" stroke-opacity="1" stroke-width="1.25" marker-end="url(#te-head-response)"></path><g data-uipack="label"><rect x="188.6" y="275" width="342.8" height="17" fill="#fffdf9"></rect><text x="360" y="286" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">SHORT-LIVED TOKEN · ACT CLAIM: AGENT FOR USER</text></g><g data-uipack="packet" data-kind="response"><circle cx="0" cy="0" r="4" fill="#1baf7a" stroke="#fffdf9" stroke-width="1.5"></circle><animateMotion dur="2s" begin="-1s" repeatCount="indefinite" path="M540,296 L190,296" calcMode="linear"></animateMotion></g><path data-uipack="connector" data-kind="request" d="M180,360 L898,360" fill="none" stroke="#2a78d6" stroke-opacity="1" stroke-width="1.25" marker-end="url(#te-head-request)"></path><g data-uipack="label"><rect x="626.72" y="339" width="186.56" height="17" fill="#fffdf9"></rect><text x="720" y="350" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">THAT TOKEN, NOTHING ELSE</text></g><g data-uipack="packet" data-kind="request"><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#2a78d6" stroke="#fffdf9" stroke-width="1.5"></rect><animateMotion dur="2.4s" begin="-1.5s" repeatCount="indefinite" path="M180,360 L890,360" calcMode="linear"></animateMotion></g><path data-uipack="connector" data-kind="response" d="M900,416 L958,416 Q964,416 964,422 L964,458 Q964,464 958,464 L902,464" fill="none" stroke="#1baf7a" stroke-opacity="1" stroke-width="1.25" marker-end="url(#te-head-response)"></path><g data-uipack="label"><rect x="720.3199999999999" y="423" width="171.68" height="17" fill="#fffdf9"></rect><text x="888" y="434" text-anchor="end" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">AUDIENCE IS ME? SCOPE?</text></g><g data-uipack="label"><rect x="794.72" y="441" width="97.28" height="17" fill="#fffdf9"></rect><text x="888" y="452" text-anchor="end" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">NOT EXPIRED?</text></g><g data-uipack="packet" data-kind="response"><circle cx="0" cy="0" r="4" fill="#1baf7a" stroke="#fffdf9" stroke-width="1.5"></circle><animateMotion dur="2s" begin="-0.3s" repeatCount="indefinite" path="M900,416 L958,416 Q964,416 964,422 L964,458 Q964,464 958,464 L910,464" calcMode="linear"></animateMotion></g></g></svg>
