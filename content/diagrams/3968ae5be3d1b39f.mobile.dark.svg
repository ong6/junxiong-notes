<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 592" width="400" height="592" color="#ece7de" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="One decode step: the weights (16 GB, shared) and each sequence's KV cache (268 MB each) are read from GPU memory every step, one matmul runs over B rows, and B tokens come out, one per sequence. At batch 1 the step reads 16.3 GB for 1 token in 4.9 ms; at batch 64 it reads 33.2 GB for 64 tokens in 9.9 ms."><style>text{user-select:none}</style><g transform="translate(0,0)"><defs><marker id="gbm-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"></path></marker><marker id="gbm-head-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#199e70"></path></marker><marker id="gbm-head-request" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#3987e5"></path></marker><marker id="gbm-head-response" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#199e70"></path></marker><marker id="gbm-head-change" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#d95926"></path></marker></defs><g data-uipack="group"><g class="uipack__group-frame"><rect x="16" y="16" width="368" height="192" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.25" stroke-dasharray="4 4"></rect><text x="32" y="38" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".08em" fill="currentColor" fill-opacity="0.75">GPU MEMORY · 80 GB</text></g></g><g data-uipack="node"><rect x="32" y="48" width="336" height="60" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 32 48 h 336 v 60 h -336 Z" fill="transparent" stroke="none" aria-hidden="true"></path><g transform="translate(46, 70)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="8" cy="3.5" rx="6" ry="2.5"></ellipse><path d="M2 3.5v9c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-9"></path><path d="M2 8c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5"></path></g><text x="72" y="75" text-anchor="start" font-size="16" font-weight="600" fill="currentColor">Weights</text> <text x="72" y="93" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">16 GB · shared</text></g><g data-uipack="node"><rect x="32" y="120" width="160" height="40" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 32 113 h 160 v 54 h -160 Z" fill="transparent" stroke="none" aria-hidden="true"></path><text x="112" y="144.9" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">KV · seq 1</text></g><g data-uipack="node"><rect x="208" y="120" width="160" height="40" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 208 113 h 160 v 54 h -160 Z" fill="transparent" stroke="none" aria-hidden="true"></path><text x="288" y="144.9" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">KV · seq B</text></g><g data-uipack="label"><rect x="114.49" y="176" width="171.02" height="18" fill="#12110f"></rect><text x="200" y="188" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">268 MB PER SEQUENCE</text></g><path data-uipack="connector" data-kind="request" d="M200,210 L200,244" fill="none" stroke="#3987e5" stroke-opacity="1" stroke-width="1.25" marker-end="url(#gbm-head-request)"></path><g data-uipack="packet" data-kind="request"><g><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#3987e5" stroke="#12110f" stroke-width="1.5"></rect><animateTransform attributeName="transform" type="scale" dur="0.9s" begin="0s" repeatCount="indefinite" calcMode="spline" values="0;1.2;1;1;0" keyTimes="0;0.12;0.2;0.8;1" keySplines="0.2 0.9 0.3 1;0.4 0 0.6 1;0 0 1 1;0.6 0 0.9 0.4"></animateTransform></g><animateMotion dur="0.9s" begin="0s" repeatCount="indefinite" path="M200,214 L200,236" calcMode="linear"></animateMotion></g><g data-uipack="label"><rect x="208" y="221" width="136.70000000000002" height="18" fill="#12110f"></rect><text x="212" y="233" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">READ EVERY STEP</text></g><g data-uipack="node"><rect x="32" y="248" width="336" height="64" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 32 248 h 336 v 64 h -336 Z" fill="transparent" stroke="none" aria-hidden="true"></path><g transform="translate(46, 272)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="12" height="8" rx="2"></rect><circle cx="5.5" cy="8" r="1" fill="currentColor"></circle><circle cx="8" cy="8" r="1" fill="currentColor"></circle><circle cx="10.5" cy="8" r="1" fill="currentColor"></circle><path d="M8 1.5V4M8 12v2.5"></path></g><text x="72" y="277" text-anchor="start" font-size="16" font-weight="600" fill="currentColor">Tensor cores</text> <text x="72" y="295" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">one matmul · B rows</text></g><path data-uipack="connector" data-kind="response" d="M200,314 L200,340" fill="none" stroke="#199e70" stroke-opacity="1" stroke-width="1.25" marker-end="url(#gbm-head-response)"></path><g data-uipack="node"><rect x="32" y="344" width="336" height="44" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 32 339 h 336 v 54 h -336 Z" fill="transparent" stroke="none" aria-hidden="true"></path><text x="200" y="370.9" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">B tokens out · one per sequence</text></g><text x="16" y="432" font-size="15" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="1">Bytes read per step, to scale</text><text x="16" y="462" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1">Batch 1 · 1 token · 4.9 ms</text><rect x="16" y="470" width="169.6" height="20" rx="3" fill="#3987e5"></rect><rect x="187.6" y="470" width="3" height="20" rx="3" fill="#d95926"></rect><text x="16" y="518" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1">Batch 64 · 64 tokens · 9.9 ms</text><rect x="16" y="526" width="169.6" height="20" rx="3" fill="#3987e5"></rect><rect x="187.6" y="526" width="182.32" height="20" rx="3" fill="#d95926"></rect><rect x="16" y="566" width="14" height="14" rx="2" fill="#3987e5"></rect><text x="36" y="578" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1">weights 16 GB</text><rect x="180" y="566" width="14" height="14" rx="2" fill="#d95926"></rect><text x="200" y="578" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1">KV 268 MB × B</text></g></svg>
