<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 464" width="1144" height="464" color="#14110d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="The decide skill as a flow from left to right. A question is sized first: a decision that is cheap to undo exits early as a quick pick with a cheap test. A consequential one goes to the frame step, which turns the two offered options, X and Y, into four by adding neither and a third path, the two the user did not list. Three walls then narrow the set: checking the inputs turns hopes into odds and stops one option, the numbers that decide it stop a second, and the downside check stops a third. Which option stops where is illustrative. The survivor is pre-mortemed and becomes one pick with the fact that would flip it, and a tripwire set at the same time loops back to the frame step to reopen the decision if it trips."><style>text{user-select:none}</style><g transform="translate(0,0)"><defs><marker id="dp-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"></path></marker><marker id="dp-head-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#0f7a55"></path></marker><marker id="dp-head-request" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#2a78d6"></path></marker><marker id="dp-head-response" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#0f7a55"></path></marker><marker id="dp-head-change" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#eb6834"></path></marker