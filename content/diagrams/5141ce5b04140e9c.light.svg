<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="1080" height="420" color="#14110d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Three memory claims feed one total: Q4 weights at 63 GB for a 120B MoE, the KV cache at real context (Gemma 4 at 128K: 105 GiB; Qwen3-Next at 1M: 24 GiB), and about 20% headroom for the OS and prompt cache. The total resident is 1.5 to 2 times the weights. If it fits RAM the context is usable; over budget means cutting context or quantising harder."><style>text{user-select:none}</style><g transform="translate(0,0)"><defs><marker id="ms-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"></path></marker><marker id="ms-head-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#1baf7a"></path></marker><marker id="ms-head-request" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#2a78d6"></path></marker><marker id="ms-head-response" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#1baf7a"></path></marker><marker id="ms-head-change" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#eb6834"></path></marker></defs><g data-uipack="node"><rect x="16" y="48" width="376" height="80" rx="6" fill="#f6f2ea" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><g transform="translate(30, 80)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="12" height="8" rx="2"></rect><circle cx="5.5" cy="8" r="1" fill="currentColor"></circle><circle cx="8" cy="8" r="1" fill="currentColor"></circle><circle cx="10.5" cy="8" r="1" fill="currentColor"></circle><path d="M8 1.5V4M8 12v2.5"></path></g><text x="56" y="85" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">1 · Q4 weights</text><text x="56" y="103" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">63 GB, 120B MoE · what most tables count</text></g><g data-uipack="node"><rect x="16" y="152" width="376" height="80" rx="6" fill="#f6f2ea" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><g transform="translate(30, 184)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1.5 3.5 9H8l-1 5.5L12.5 7H8z"></path></g><text x="56" y="189" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">2 · KV cache at real context</text><text x="56" y="207" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">Gemma 4 @128K: 105 GiB · Qwen3-Next @1M: 24 GiB</text></g><g data-uipack="node"><rect x="16" y="256" width="376" height="80" rx="6" fill="#f6f2ea" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><g transform="translate(30, 288)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="12" height="12" rx="2"></rect><path d="M5 8h6M8 5v6"></path></g><text x="56" y="293" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">3 · OS + prompt cache</text><text x="56" y="311" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">~20% headroom · 40K ctx: 5s, not 200s</text></g><g data-uipack="bus"><path data-uipack="connector" d="M432,88 L432,296" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.25"></path><path data-uipack="connector" d="M432,88 L394,88" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.25"></path><path data-uipack="connector" d="M432,192 L394,192" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.25"></path><path data-uipack="connector" d="M432,296 L394,296" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.25"></path><path data-uipack="connector" d="M432,192 L468,192" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.25" marker-end="url(#ms-head)"></path><circle data-uipack="junction" cx="432" cy="88" r="2.5" fill="currentColor" fill-opacity="0.7"></circle><circle data-uipack="junction" cx="432" cy="192" r="2.5" fill="currentColor" fill-opacity="0.7"></circle><circle data-uipack="junction" cx="432" cy="296" r="2.5" fill="currentColor" fill-opacity="0.7"></circle><circle data-uipack="junction" cx="432" cy="192" r="2.5" fill="currentColor" fill-opacity="0.7"></circle></g><g data-uipack="packet"><circle cx="0" cy="0" r="4" fill="currentColor" stroke="#fffdf9" stroke-width="1.5"></circle><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" path="M394,88 L420,88" calcMode="linear"></animateMotion></g><g data-uipack="packet"><circle cx="0" cy="0" r="4" fill="currentColor" stroke="#fffdf9" stroke-width="1.5"></circle><animateMotion dur="1.6s" begin="-0.5s" repeatCount="indefinite" path="M394,192 L420,192" calcMode="linear"></animateMotion></g><g data-uipack="packet"><circle cx="0" cy="0" r="4" fill="currentColor" stroke="#fffdf9" stroke-width="1.5"></circle><animateMotion dur="1.6s" begin="-1s" repeatCount="indefinite" path="M394,296 L420,296" calcMode="linear"></animateMotion></g><g data-uipack="label"><rect x="431.88" y="172" width="40.24" height="18" fill="#fffdf9"></rect><text x="452" y="184" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">PLUS</text></g><g data-uipack="packet"><circle cx="0" cy="0" r="4" fill="currentColor" stroke="#fffdf9" stroke-width="1.5"></circle><animateMotion dur="1.6s" begin="-0.9s" repeatCount="indefinite" path="M434,192 L460,192" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="472" y="152" width="232" height="80" rx="6" fill="#f6f2ea" stroke="#1baf7a" stroke-opacity="1" stroke-width="1.25"></rect><g transform="translate(486, 184)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="8" cy="3.5" rx="6" ry="2.5"></ellipse><path d="M2 3.5v9c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-9"></path><path d="M2 8c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5"></path></g><text x="512" y="189" text-anchor="start" font-size="19" font-weight="600" fill="#1baf7a">Total resident</text><text x="512" y="207" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">1.5–2× weights</text></g><path data-uipack="connector" data-kind="response" d="M706,192 L738,192 Q744,192 744,186 L744,126 Q744,120 750,120 L796,120" fill="none" stroke="#1baf7a" stroke-opacity="1" stroke-width="1.25" marker-end="url(#ms-head-response)"></path><g data-uipack="label"><rect x="705.28" y="95" width="77.44" height="19" fill="#fffdf9"></rect><text x="744" y="108" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">FITS RAM</text></g><g data-uipack="packet" data-kind="response"><circle cx="0" cy="0" r="4" fill="#1baf7a" stroke="#fffdf9" stroke-width="1.5"></circle><animateMotion dur="1.8s" begin="0s" repeatCount="indefinite" path="M706,192 L738,192 Q744,192 744,186 L744,126 Q744,120 750,120 L788,120" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="800" y="88" width="240" height="64" rx="6" fill="#f6f2ea" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><g transform="translate(814, 112)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 14h12M4 11V7M8 11V4M12 11V8.5"></path></g><text x="840" y="126.65" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Context is usable</text></g><path data-uipack="connector" data-kind="change" d="M706,192 L738,192 Q744,192 744,198 L744,258 Q744,264 750,264 L796,264" fill="none" stroke="#eb6834" stroke-opacity="1" stroke-width="1.25" marker-end="url(#ms-head-change)"></path><g data-uipack="label"><rect x="692.26" y="275" width="103.48" height="19" fill="#fffdf9"></rect><text x="744" y="288" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">OVER BUDGET</text></g><g data-uipack="packet" data-kind="change"><path d="M0,-4.8 L4.8,0 L0,4.8 L-4.8,0 Z" fill="#eb6834" stroke="#fffdf9" stroke-width="1.5"></path><animateMotion dur="1.8s" begin="-0.9s" repeatCount="indefinite" path="M706,192 L738,192 Q744,192 744,198 L744,258 Q744,264 750,264 L788,264" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="800" y="232" width="240" height="64" rx="6" fill="#f6f2ea" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25" stroke-dasharray="4 4"></rect><g transform="translate(814, 256)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2 14.5 13.5h-13z"></path><path d="M8 6.5v3.5M8 12.25h.01"></path></g><text x="840" y="261" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Cut context, or</text><text x="840" y="279" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">quanti