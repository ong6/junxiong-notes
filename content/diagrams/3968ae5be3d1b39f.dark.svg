<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 496" width="1080" height="496" color="#ece7de" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="One decode step on an H100 serving Llama 3.1 8B. The tensor cores read the 16 GB of weights once, plus every sequence's own KV cache, run one matmul over B rows and emit the next token for each of the B sequences. Drawn to scale: at batch 1 the step reads 16.3 GB for 1 token in about 4.9 ms; at batch 64 it reads 33.2 GB, of which 17.2 GB is KV cache, for 64 tokens in about 9.9 ms."><style>text{user-select:none}</style><g transform="translate(0,0)"><defs><marker id="gb-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"></path></marker><marker id="gb-head-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#199e70"></path></marker><marker id="gb-head-request" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#3987e5"></path></marker><marker id="gb-head-response" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#199e70"></path></marker><marker id="gb-head-change" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#d95926"></path></marker></defs><g data-uipack="group"><rect x="24" y="24" width="312" height="272" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.25" stroke-dasharray="4 4"></rect><text x="40" y="46" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".08em" fill="currentColor" fill-opacity="0.75">GPU MEMORY (HBM) · 80 GB</text></g><g data-uipack="node"><rect x="40" y="60" width="272" height="72" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 40 60 h 272 v 72 h -272 Z" fill="transparent" stroke="none" aria-hidden="true"></path><g transform="translate(54, 88)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="8" cy="3.5" rx="6" ry="2.5"></ellipse><path d="M2 3.5v9c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-9"></path><path d="M2 8c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5"></path></g><text x="80" y="93" text-anchor="start" font-size="16" font-weight="600" fill="currentColor">Weights</text><text x="80" y="111" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">16 GB · shared by every user</text></g><g data-uipack="node"><rect x="40" y="148" width="272" height="40" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 40 141 h 272 v 54 h -272 Z" fill="transparent" stroke="none" aria-hidden="true"></path><text x="176" y="172.9" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">KV cache · seq 1</text></g><g data-uipack="node"><rect x="40" y="196" width="272" height="40" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 40 189 h 272 v 54 h -272 Z" fill="transparent" stroke="none" aria-hidden="true"></path><text x="176" y="220.9" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">KV cache · seq 2</text></g><g data-uipack="node"><rect x="40" y="244" width="272" height="40" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 40 237 h 272 v 54 h -272 Z" fill="transparent" stroke="none" aria-hidden="true"></path><text x="176" y="268.9" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">KV cache · seq B</text></g><path data-uipack="connector" data-kind="request" d="M314,96 L402,96 Q408,96 408,102 L408,146 Q408,152 414,152 L492,152" fill="none" stroke="#3987e5" stroke-opacity="1" stroke-width="1.25" marker-end="url(#gb-head-request)"></path><g data-uipack="label"><rect x="379.73" y="72" width="80.54" height="18" fill="#12110f"></rect><text x="420" y="84" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">READ ONCE</text></g><g data-uipack="packet" data-kind="request"><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#3987e5" stroke="#12110f" stroke-width="1.5"></rect><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" path="M318,96 L402,96 Q408,96 408,102 L408,146 Q408,152 414,152 L484,152" calcMode="linear"></animateMotion></g><path data-uipack="connector" data-kind="change" d="M314,168 L426,168 Q432,168 432,174 L432,194 Q432,200 438,200 L492,200" fill="none" stroke="#d95926" stroke-opacity="1" stroke-width="1.25" marker-end="url(#gb-head-change)"></path><path data-uipack="connector" data-kind="change" d="M314,216 L426,216 Q432,216 432,210 L432,206 Q432,200 438,200 L492,200" fill="none" stroke="#d95926" stroke-opacity="1" stroke-width="1.25" marker-end="url(#gb-head-change)"></path><path data-uipack="connector" data-kind="change" d="M314,264 L426,264 Q432,264 432,258 L432,206 Q432,200 438,200 L492,200" fill="none" stroke="#d95926" stroke-opacity="1" stroke-width="1.25" marker-end="url(#gb-head-change)"></path><g data-uipack="packet" data-kind="change"><path d="M0,-4.8 L4.8,0 L0,4.8 L-4.8,0 Z" fill="#d95926" stroke="#12110f" stroke-width="1.5"></path><animateMotion dur="1.6s" begin="-0.5s" repeatCount="indefinite" path="M318,264 L426,264 Q432,264 432,258 L432,206 Q432,200 438,200 L484,200" calcMode="linear"></animateMotion></g><g data-uipack="label"><rect x="311.25" y="300" width="209.5" height="18" fill="#12110f"></rect><text x="416" y="312" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">+ EVERY SEQUENCE&#x27;S OWN KV</text></g><g data-uipack="node"><rect x="496" y="124" width="232" height="104" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 496 124 h 232 v 104 h -232 Z" fill="transparent" stroke="none" aria-hidden="true"></path><g transform="translate(510, 168)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="12" height="8" rx="2"></rect><circle cx="5.5" cy="8" r="1" fill="currentColor"></circle><circle cx="8" cy="8" r="1" fill="currentColor"></circle><circle cx="10.5" cy="8" r="1" fill="currentColor"></circle><path d="M8 1.5V4M8 12v2.5"></path></g><text x="536" y="173" text-anchor="start" font-size="16" font-weight="600" fill="currentColor">Tensor cores</text><text x="536" y="191" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">one matmul · B rows</text></g><path data-uipack="connector" data-kind="response" d="M730,176 L778,176 Q784,176 784,170 L784,154 Q784,148 790,148 L828,148" fill="none" stroke="#199e70" stroke-opacity="1" stroke-width="1.25" marker-end="url(#gb-head-response)"></path><path data-uipack="connector" data-kind="response" d="M730,176 L778,176 Q784,176 784,182 L784,190 Q784,196 790,196 L828,196" fill="none" stroke="#199e70" stroke-opacity="1" stroke-width="1.25" marker-end="url(#gb-head-response)"></path><path data-uipack="connector" data-kind="response" d="M730,176 L778,176 Q784,176 784,182 L784,238 Q784,244 790,244 L828,244" fill="none" stroke="#199e70" stroke-opacity="1" stroke-width="1.25" marker-end="url(#gb-head-response)"></path><g data-uipack="packet" data-kind="response"><circle cx="0" cy="0" r="4" fill="#199e70" stroke="#12110f" stroke-width="1.5"></circle><animateMotion dur="1.4s" begin="-0.3s" repeatCount="indefinite" path="M734,176 L778,176 Q784,176 784,170 L784,154 Q784,148 790,148 L820,148" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="832" y="128" width="224" height="40" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 832 121 h 224 v 54 h -224 Z" fill="transparent" stroke="none" aria-hidden="true"></path><text x="944" y="152.9" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">next token · seq 1</text></g><g data-uipack="node"><rect x="832" y="176" width="224" height="40" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 832 169 h 224 v 54 h -224 Z" fill="transparent" stroke="none" aria-hidden="true"></path><text x="944" y="200.9" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">next token · seq 2</text></g><g data-uipack="node"><rect x="832" y="224" width="224" height="40" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 832 217 h 224 v 54 h -224 Z" fill="transparent" stroke="none" aria-hidden="true"></path><text x="944" y="248.9" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">next token · seq B</text></g><g data-uipack="label"><rect x="871.49" y="100" width="145.02" height="18" fill="#12110f"></rect><text x="944" y="112" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">B TOKENS PER STEP</text></g><text x="24" y="352" font-size="15" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="1">Bytes read per decode step, to scale</text><text x="24" y="399" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1">Batch 1</text><rect x="144" y="380" width="308.8" height="28" rx="3" fill="#3987e5"></rect><rect x="454.8" y="380" width="5.211" height="28" rx="3" fill="#d95926"></rect><text x="800" y="399" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1">16.3 GB → 1 token · 4.9 ms</text><text x="24" y="451" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1">Batch 64</text><rect x="144" y="432" width="308.8" height="28" rx="3" fill="#3987e5"></rect><rect x="454.8" y="432" width="331.96" height="28" rx="3" fill="#d95926"></rect><text x="800" y="451" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="400" text-anchor="start" fill="currentColor" fill-opacity="1">33.2 GB → 64 tokens · 9.9 ms</text><text x="298" y="484" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">weights · 16 GB</text><text x="620.78" y="484" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="400" text-anchor="middle" fill="currentColor" fill-opacity="0.72">KV · 64 × 268 MB = 17.2 GB</text></g></svg>
