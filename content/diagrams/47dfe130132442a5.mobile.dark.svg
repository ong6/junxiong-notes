<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 784" width="440" height="784" color="#ece7de" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Defects in agent-written code enter on the left as seven packets and pass through six walls in order: the agent's self-check, deterministic CI, multi-agent AI review, security review, human approval by risk tier, and the merge queue with flags and staged rollout. Each wall has holes, and each stops one defect, so the count falls from seven to one; the counts are illustrative, not measured. Anthropic estimates the AI review would have caught about a third of past incident bugs. A seventh layer, a daily eval of past incidents, checks the AI reviewer itself. The one defect that slips through every wall reaches rollback, where a flag is switched off without a deploy. An eighth layer, containment, frames the whole flow: sandboxes and narrow identities limit what any agent can do. In the Claude Code repository from June to September 2026, merged pull requests more than doubled while the reverted share fell by more than 40%."><style>text{user-select:none}</style><g transform="translate(0,0)"><defs><marker id="vsm-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"></path></marker><marker id="vsm-head-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#199e70"></path></marker><marker id="vsm-head-request" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#3987e5"></path></marker><marker id="vsm-head-response" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#199e70"></path></marker><marker id="vsm-head-change" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#d95926"></path></marker></defs><g data-uipack="group"><rect x="8" y="8" width="424" height="768" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.25" stroke-dasharray="4 4"></rect><text x="24" y="30" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".08em" fill="currentColor" fill-opacity="0.75">8 · CONTAINMENT, EVERY TOOL CALL</text><g data-uipack="node"><rect x="32" y="40" width="168" height="56" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25" stroke-dasharray="4 4"></rect><path class="uipack__touch-target" d="M 32 40 h 168 v 56 h -168 Z" fill="transparent" stroke="none" aria-hidden="true"></path><text x="116" y="65" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor">Defects</text><text x="116" y="84" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">agent code</text></g><g><path data-uipack="connector" d="M40,98 L40,192" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.25"></path><path d="M40,185 L44,189 L40,193 L36,189 z" fill="#d95926" fill-opacity="0.55"></path><g data-uipack="packet" data-kind="change"><path d="M0,-4.8 L4.8,0 L0,4.8 L-4.8,0 Z" fill="#d95926" stroke="#12110f" stroke-width="1.5"></path><animateMotion dur="0.8166666666666667s" begin="0s" repeatCount="indefinite" path="M40,102 L40,182" calcMode="linear"></animateMotion></g></g><g><path data-uipack="connector" d="M64,98 L64,512" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.25"></path><path d="M64,505 L68,509 L64,513 L60,509 z" fill="#d95926" fill-opacity="0.55"></path><g data-uipack="packet" data-kind="change"><path d="M0,-4.8 L4.8,