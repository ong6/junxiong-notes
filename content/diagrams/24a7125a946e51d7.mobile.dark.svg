<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 408" width="360" height="408" color="#ece7de" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="The council loop stacked: a version with references goes to three fresh reviewers who pick their own metrics and never see the target, then to a gate. A pass keeps the best compliant version; a fail goes to a fix step that loops back to the version, at most three rounds."><style>text{user-select:none}</style><g transform="translate(0,0)"><defs><marker id="cnm-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"></path></marker><marker id="cnm-head-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#199e70"></path></marker><marker id="cnm-head-request" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#3987e5"></path></marker><marker id="cnm-head-response" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#199e70"></path></marker><marker id="cnm-head-change" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#d95926"></path></marker></defs><g data-uipack="node"><rect x="40" y="24" width="248" height="56" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 40 24 h 248 v 56 h -248 Z" fill="transparent" stroke="none" aria-hidden="true"></path><text x="164" y="49" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor">Version vN</text><text x="164" y="68" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">+ before · references</text></g><path data-uipack="connector" data-kind="request" d="M164,82 L164,108" fill="none" stroke="#3987e5" stroke-opacity="1" stroke-width="1.25" marker-end="url(#cnm-head-request)"></path><g data-uipack="packet" data-kind="request"><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#3987e5" stroke="#12110f" stroke-width="1.5"></rect><animateMotion dur="0.9s" begin="0s" repeatCount="indefinite" path="M164,86 L164,100" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="40" y="112" width="248" height="72" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 40 112 h 248 v 72 h -248 Z" fill="transparent" stroke="none" aria-hidden="true"></path><text x="164" y="145" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor">3 fresh reviewers</text><text x="164" y="164" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">own metrics · target hidden</text></g><path data-uipack="connector" data-kind="request" d="M164,186 L164,212" fill="none" stroke="#3987e5" stroke-opacity="1" stroke-width="1.25" marker-end="url(#cnm-head-request)"></path><g data-uipack="node"><rect x="40" y="216" width="248" height="64" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 40 216 h 248 v 64 h -248 Z" fill="transparent" stroke="none" aria-hidden="true"></path><text x="164" y="245" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor">Gate</text><text x="164" y="264" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">constraints · all ≥ target</text></g><path data-uipack="connector" data-kind="response" d="M112,282 L112,316" fill="none" stroke="#199e70" stroke-opacity="1" stroke-width="1.25" marker-end="url(#cnm-head-response)"></path><g data-uipack="label"><rect x="65.28" y="293" width="42.72" height="19" fill="#12110f"></rect><text x="104" y="306" text-anchor="end" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">PASS</text></g><g data-uipack="node"><rect x="24" y="320" width="152" height="64" rx="6" fill="#1b1917" stroke="#199e70" stroke-opacity="1" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 24 320 h 152 v 64 h -152 Z" fill="transparent" stroke="none" aria-hidden="true"></path><text x="100" y="349" text-anchor="middle" font-size="16" font-weight="600" fill="#199e70">Keep</text><text x="100" y="368" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">best compliant</text></g><path data-uipack="connector" data-kind="change" d="M216,282 L216,316" fill="none" stroke="#d95926" stroke-opacity="1" stroke-width="1.25" marker-end="url(#cnm-head-change)"></path><g data-uipack="label"><rect x="220" y="293" width="42.72" height="19" fill="#12110f"></rect><text x="224" y="306" text-anchor="start" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">FAIL</text></g><g data-uipack="node"><rect x="184" y="320" width="152" height="64" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 184 320 h 152 v 64 h -152 Z" fill="transparent" stroke="none" aria-hidden="true"></path><text x="260" y="349" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor">Fix</text><text x="260" y="368" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">≤ 3 rounds</text></g><path data-uipack="connector" data-kind="change" d="M338,352 L343,352 Q348,352 348,347 L348,58 Q348,52 342,52 L292,52" fill="none" stroke="#d95926" stroke-opacity="1" stroke-width="1.25" marker-end="url(#cnm-head-change)"></path><g data-uipack="packet" data-kind="change"><path d="M0,-4.8 L4.8,0 L0,4.8 L-4.8,0 Z" fill="#d95926" stroke="#12110f" stroke-width="1.5"></path><animateMotion dur="2.2s" begin="-0.8s" repeatCount="indefinite" path="M342,352 L345,352 Q348,352 348,349 L348,58 Q348,52 342,52 L300,52" calcMode="linear"></animateMotion></g></g></svg>
