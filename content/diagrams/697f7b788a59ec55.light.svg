<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" width="1080" height="300" color="#14110d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="A prompt of N tokens enters prefill, one compute-bound N-row GEMM that saturates FLOPs and emits the first token (TTFT). Decode then loops, one bandwidth-bound 1-row matmul per token, and every pass re-reads every weight and the whole growing KV cache."><style>text{user-select:none}</style><g transform="translate(0,0)"><defs><marker id="pd-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"></path></marker><marker id="pd-head-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#1baf7a"></path></marker><marker id="pd-head-request" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#2a78d6"></path></marker><marker id="pd-head-response" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#1baf7a"></path></marker><marker id="pd-head-change" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#eb6834"></path></marker></defs><g data-uipack="node"><rect x="48" y="112" width="200" height="72" rx="6" fill="#f6f2ea" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><g transform="translate(62, 140)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.5h5.5L13 5v9.5H4z"></path><path d="M9.5 1.5V5H13M6 8h4M6 11h4"></path></g><text x="88" y="145" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Prompt</text><text x="88" y="163" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">N tokens</text></g><path data-uipack="connector" data-kind="request" d="M250,148 L324,148" fill="none" stroke="#2a78d6" stroke-opacity="1" stroke-width="1.25" marker-end="url(#pd-head-request)"></path><g data-uipack="label"><rect x="235.64" y="126" width="104.72" height="18" fill="#fffdf9"></rect><text x="288" y="138" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">ALL N TOKENS</text></g><g data-uipack="packet" data-kind="request"><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#2a78d6" stroke="#fffdf9" stroke-width="1.5"></rect><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" path="M250,148 L316,148" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="328" y="96" width="280" height="104" rx="6" fill="#f6f2ea" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><g transform="translate(342, 140)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="12" height="8" rx="2"></rect><circle cx="5.5" cy="8" r="1" fill="currentColor"></circle><circle cx="8" cy="8" r="1" fill="currentColor"></circle><circle cx="10.5" cy="8" r="1" fill="currentColor"></circle><path d="M8 1.5V4M8 12v2.5"></path></g><text x="368" y="145" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Prefill · compute-bound</text><text x="368" y="163" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">one N-row GEMM · saturates FLOPs</text></g><path data-uipack="connector" data-kind="request" d="M610,148 L700,148" fill="none" stroke="#2a78d6" stroke-opacity="1" stroke-width="1.25" marker-end="url(#pd-head-request)"></path><g data-uipack="label"><rect x="579.46" y="126" width="153.08" height="18" fill="#fffdf9"></rect><text x="656" y="138" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">FIRST TOKEN · TTFT</text></g><g data-uipack="packet" data-kind="request"><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#2a78d6" stroke="#fffdf9" stroke-width="1.5"></rect><animateMotion dur="1.6s" begin="-0.8s" repeatCount="indefinite" path="M610,148 L692,148" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="704" y="96" width="328" height="104" rx="6" fill="#f6f2ea" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><g transform="translate(718, 140)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1.5 3.5 9H8l-1 5.5L12.5 7H8z"></path></g><text x="744" y="145" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Decode · bandwidth-bound</text><text x="744" y="163" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">one 1-row matmul · one token out</text></g><path data-uipack="connector" data-kind="change" d="M900,94 L900,54 Q900,48 894,48 L806,48 Q800,48 800,54 L800,92" fill="none" stroke="#eb6834" stroke-opacity="1" stroke-width="1.25" marker-end="url(#pd-head-change)"></path><g data-uipack="label"><rect x="600.1700000000001" y="28" width="499.65999999999997" height="18" fill="#fffdf9"></rect><text x="850" y="40" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">EVERY PASS RE-READS EVERY WEIGHT + THE WHOLE GROWING KV CACHE</text></g><g data-uipack="packet" data-kind="change"><path d="M0,-4.8 L4.8,0 L0,4.8 L-4.8,0 Z" fill="#eb6834" stroke="#fffdf9" stroke-width="1.5"></path><animateMotion dur="1.8s" begin="-0.4s" repeatCount="indefinite" path="M900,94 L900,54 Q900,48 894,48 L806,48 Q800,48 800,54 L800,84" calcMode="linear"></animateMotion></g></g></svg>
