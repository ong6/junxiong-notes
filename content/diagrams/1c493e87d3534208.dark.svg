<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 280" width="1080" height="280" color="#ece7de" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Requests from many users go through a router that picks a replica, then a scheduler that queues them under a token budget and admits them to the engine. Each forward pass reads the weights once and produces one token for every sequence in the batch, so the step time is everyone's per-token latency. Tokens stream back to users; the first arrives after queue wait plus prefill."><style>text{user-select:none}</style><g transform="translate(0,0)"><defs><marker id="sp-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"></path></marker><marker id="sp-head-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#199e70"></path></marker><marker id="sp-head-request" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#3987e5"></path></marker><marker id="sp-head-response" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#199e70"></path></marker><marker id="sp-head-change" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#d95926"></path></marker></defs><g data-uipack="node"><rect x="24" y="104" width="144" height="72" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 24 104 h 144 v 72 h -144 Z" fill="transparent" stroke="none" aria-hidden="true"></path><g transform="translate(38, 132)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5.5" r="3"></circle><path d="M2.5 14.5c0-3 2.5-5 5.5-5s5.5 2 5.5 5"></path></g><text x="64" y="137" text-anchor="start" font-size="18" font-weight="600" fill="currentColor">Users</text> <text x="64" y="155" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">N requests</text></g><path data-uipack="connector" data-kind="request" d="M170,140 L236,140" fill="none" stroke="#3987e5" stroke-opacity="1" stroke-width="1.25" marker-end="url(#sp-head-request)"></path><g data-uipack="packet" data-kind="request"><g><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#3987e5" stroke="#12110f" stroke-width="1.5"></rect><animateTransform attributeName="transform" type="scale" dur="1.4s" begin="0s" repeatCount="indefinite" calcMode="spline" values="0;1.2;1;1;0" keyTimes="0;0.12;0.2;0.8;1" keySplines="0.2 0.9 0.3 1;0.4 0 0.6 1;0 0 1 1;0.6 0 0.9 0.4"></animateTransform></g><animateMotion dur="1.4s" begin="0s" repeatCount="indefinite" path="M174,140 L228,140" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="240" y="96" width="192" height="88" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 240 96 h 192 v 88 h -192 Z" fill="transparent" stroke="none" aria-hidden="true"></path><text x="254" y="137" text-anchor="start" font-size="18" font-weight="600" fill="currentColor">Router</text> <text x="254" y="155" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">picks a replica</text></g><path data-uipack="connector" data-kind="request" d="M434,140 L508,140" fill="none" stroke="#3987e5" stroke-opacity="1" stroke-width="1.25" marker-end="url(#sp-head-request)"></path><g data-uipack="packet" data-kind="request"><g><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#3987e5" stroke="#12110f" stroke-width="1.5"></rect><animateTransform attributeName="transform" type="scale" dur="1.4s" begin="-0.7s" repeatCount="indefinite" calcMode="spline" values="0;1.2;1;1;0" keyTimes="0;0.12;0.2;0.8;1" keySplines="0.2 0.9 0.3 1;0.4 0 0.6 1;0 0 1 1;0.6 0 0.9 0.4"></animateTransform></g><animateMotion dur="1.4s" begin="-0.7s" repeatCount="indefinite" path="M438,140 L500,140" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="512" y="96" width="232" height="88" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 512 96 h 232 v 88 h -232 Z" fill="transparent" stroke="none" aria-hidden="true"></path><g transform="translate(526, 132)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"></circle><path d="M8 4.5V8l2.5 1.5"></path></g><text x="552" y="137" text-anchor="start" font-size="18" font-weight="600" fill="currentColor">Scheduler</text> <text x="552" y="155" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">queue · token budget</text></g><path data-uipack="connector" data-kind="request" d="M746,140 L796,140" fill="none" stroke="#3987e5" stroke-opacity="1" stroke-width="1.25" marker-end="url(#sp-head-request)"></path><g data-uipack="label"><rect x="746.55" y="116" width="50.9" height="18" fill="#12110f"></rect><text x="772" y="128" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">ADMIT</text></g><g data-uipack="node"><rect x="800" y="104" width="256" height="104" rx="6" fill="#1b1917" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><path class="uipack__touch-target" d="M 800 104 h 256 v 104 h -256 Z" fill="transparent" stroke="none" aria-hidden="true"></path><g transform="translate(814, 148)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="12" height="8" rx="2"></rect><circle cx="5.5" cy="8" r="1" fill="currentColor"></circle><circle cx="8" cy="8" r="1" fill="currentColor"></circle><circle cx="10.5" cy="8" r="1" fill="currentColor"></circle><path d="M8 1.5V4M8 12v2.5"></path></g><text x="840" y="153" text-anchor="start" font-size="18" font-weight="600" fill="currentColor">Forward pass · batch B</text> <text x="840" y="171" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">weights read once per step</text></g><path data-uipack="connector" data-kind="change" d="M968,102 L968,66 Q968,60 962,60 L874,60 Q868,60 868,66 L868,100" fill="none" stroke="#d95926" stroke-opacity="1" stroke-width="1.25" marker-end="url(#sp-head-change)"></path><g data-uipack="label"><rect x="772.4300000000001" y="18" width="291.14" height="18" fill="#12110f"></rect><text x="918" y="30" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">ONE STEP = ONE TOKEN PER SEQUENCE</text></g><g data-uipack="label"><rect x="789.5899999999999" y="36" width="256.82000000000005" height="18" fill="#12110f"></rect><text x="918" y="48" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">STEP TIME = PER-TOKEN LATENCY</text></g><g data-uipack="packet" data-kind="change"><g><path d="M0,-4.8 L4.8,0 L0,4.8 L-4.8,0 Z" fill="#d95926" stroke="#12110f" stroke-width="1.5"></path><animateTransform attributeName="transform" type="scale" dur="1.8s" begin="-0.4s" repeatCount="indefinite" calcMode="spline" values="0;1.2;1;1;0" keyTimes="0;0.093;0.156;0.822;1" keySplines="0.2 0.9 0.3 1;0.4 0 0.6 1;0 0 1 1;0.6 0 0.9 0.4"></animateTransform></g><animateMotion dur="1.8s" begin="-0.4s" repeatCount="indefinite" path="M968,98 L968,66 Q968,60 962,60 L874,60 Q868,60 868,66 L868,92" calcMode="linear"></animateMotion></g><path data-uipack="connector" data-kind="response" d="M916,210 L916,250 Q916,256 910,256 L102,256 Q96,256 96,250 L96,180" fill="none" stroke="#199e70" stroke-opacity="1" stroke-width="1.25" marker-end="url(#sp-head-response)"></path><g data-uipack="label"><rect x="240.31" y="234" width="531.38" height="18" fill="#12110f"></rect><text x="506" y="246" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">TOKENS STREAM BACK · FIRST ONE IS TTFT = QUEUE WAIT + PREFILL</text></g><g data-uipack="packet" data-kind="response"><g><circle cx="0" cy="0" r="4" fill="#199e70" stroke="#12110f" stroke-width="1.5"></circle><animateTransform attributeName="transform" type="scale" dur="2.4s" begin="0s" repeatCount="indefinite" calcMode="spline" values="0;1.2;1;1;0" keyTimes="0;0.07;0.117;0.867;1" keySplines="0.2 0.9 0.3 1;0.4 0 0.6 1;0 0 1 1;0.6 0 0.9 0.4"></animateTransform></g><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" path="M916,214 L916,250 Q916,256 910,256 L102,256 Q96,256 96,250 L96,188" calcMode="linear"></animateMotion></g></g></svg>
