<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 456" width="1080" height="456" color="#14110d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Six native page sections and their labelled CSS illustrations remain in the document. Intersection Observer callbacks identify which section crosses the viewport centre. Only that chapter mounts a canvas and Three.js renderer. Leaving the chapter unmounts its canvas, cancels its animation frame, disconnects its resize observer and disposes the renderer. Reduced motion renders one static frame. If WebGL is unavailable, the labelled CSS illustration remains."><style>text{user-select:none}</style><g transform="translate(0,0)"><defs><marker id="tsl-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"></path></marker><marker id="tsl-head-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#1baf7a"></path></marker><marker id="tsl-head-request" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#2a78d6"></path></marker><marker id="tsl-head-response" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#1baf7a"></path></marker><marker id="tsl-head-change" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#eb6834"></path></marker></defs><g data-uipack="node"><rect x="36" y="88" width="220" height="88" rx="6" fill="#f6f2ea" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><g transform="translate(50, 124)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.5h5.5L13 5v9.5H4z"></path><path d="M9.5 1.5V5H13M6 8h4M6 11h4"></path></g><text x="76" y="129" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Six HTML sections</text><text x="76" y="147" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">native document scroll</text></g><path data-uipack="connector" data-kind="request" d="M258,132 L320,132" fill="none" stroke="#2a78d6" stroke-opacity="1" stroke-width="1.25" marker-end="url(#tsl-head-request)"></path><g data-uipack="packet" data-kind="request"><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#2a78d6" stroke="#fffdf9" stroke-width="1.5"></rect><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" path="M258,132 L312,132" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="324" y="88" width="240" height="88" rx="6" fill="#f6f2ea" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><text x="338" y="129" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Viewport centre</text><text x="338" y="147" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">observer callback + rects</text></g><path data-uipack="connector" data-kind="change" d="M566,132 L628,132" fill="none" stroke="#eb6834" stroke-opacity="1" stroke-width="1.25" marker-end="url(#tsl-head-change)"></path><g data-uipack="packet" data-kind="change"><path d="M0,-4.8 L4.8,0 L0,4.8 L-4.8,0 Z" fill="#eb6834" stroke="#fffdf9" stroke-width="1.5"></path><animateMotion dur="1.6s" begin="-0.6s" repeatCount="indefinite" path="M566,132 L620,132" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="632" y="88" width="220" height="88" rx="6" fill="#f6f2ea" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><text x="646" y="129" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Active chapter</text><text x="646" y="147" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">one canvas · one renderer</text></g><path data-uipack="connector" data-kind="response" d="M854,132 L916,132" fill="none" stroke="#1baf7a" stroke-opacity="1" stroke-width="1.25" marker-end="url(#tsl-head-response)"></path><g data-uipack="packet" data-kind="response"><circle cx="0" cy="0" r="4" fill="#1baf7a" stroke="#fffdf9" stroke-width="1.5"></circle><animateMotion dur="1.6s" begin="-1.1s" repeatCount="indefinite" path="M854,132 L908,132" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="920" y="88" width="124" height="88" rx="6" fill="#f6f2ea" stroke="#1baf7a" stroke-opacity="1" stroke-width="1.25"></rect><g transform="translate(934, 124)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="12" height="8" rx="2"></rect><circle cx="5.5" cy="8" r="1" fill="currentColor"></circle><circle cx="8" cy="8" r="1" fill="currentColor"></circle><circle cx="10.5" cy="8" r="1" fill="currentColor"></circle><path d="M8 1.5V4M8 12v2.5"></path></g><text x="960" y="129" text-anchor="start" font-size="19" font-weight="600" fill="#1baf7a">3D object</text><text x="960" y="147" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">route-loaded</text></g><path data-uipack="connector" data-kind="change" d="M804,178 L804,254 Q804,260 798,260 L590,260 Q584,260 584,266 L584,300" fill="none" stroke="#eb6834" stroke-opacity="1" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#tsl-head-change)"></path><g data-uipack="label"><rect x="597.37" y="238" width="177.26" height="18" fill="#fffdf9"></rect><text x="686" y="250" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">CHAPTER LEAVES CENTRE</text></g><g data-uipack="packet" data-kind="change"><path d="M0,-4.8 L4.8,0 L0,4.8 L-4.8,0 Z" fill="#eb6834" stroke="#fffdf9" stroke-width="1.5"></path><animateMotion dur="2.4s" begin="-0.7s" repeatCount="indefinite" path="M804,178 L804,254 Q804,260 798,260 L590,260 Q584,260 584,266 L584,292" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="456" y="304" width="256" height="88" rx="6" fill="#f6f2ea" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><text x="470" y="345" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Tear down old canvas</text><text x="470" y="363" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">cancel rAF · dispose renderer</text></g><path data-uipack="connector" data-kind="change" d="M332,178 L332,254 Q332,260 326,260 L250,260 Q244,260 244,266 L244,300" fill="none" stroke="#eb6834" stroke-opacity="1" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#tsl-head-change)"></path><g data-uipack="label"><rect x="207.49" y="238" width="145.02" height="18" fill="#fffdf9"></rect><text x="280" y="250" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing=".06em" fill="currentColor" fill-opacity="0.8">WEBGL UNAVAILABLE</text></g><g data-uipack="packet" data-kind="change"><path d="M0,-4.8 L4.8,0 L0,4.8 L-4.8,0 Z" fill="#eb6834" stroke="#fffdf9" stroke-width="1.5"></path><animateMotion dur="2.2s" begin="-1.2s" repeatCount="indefinite" path="M332,178 L332,254 Q332,260 326,260 L250,260 Q244,260 244,266 L244,292" calcMode="linear"></animateMotion></g><g data-uipack="node"><rect x="116" y="304" width="256" height="88" rx="6" fill="#f6f2ea" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.25"></rect><text x="130" y="345" text-anchor="start" font-size="19" font-weight="600" fill="currentColor">Labelled CSS fallback</text><text x="130" y="363" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="currentColor" fill-opacity="0.75">mounted for every chapter</text></g></g></svg>
