# Layer-stack diagram for /agent-harnesses. Layers are listed bottom-up (first = bottom).
# The bands are plain (the article takes them a group at a time); the rails link to their sections.
# Research and sources: the store's research/industry-map/harnesses.md (2026-10-13).
zones:
  - { id: run, label: Runs the model, note: every call }
  - { id: sees, label: What the model sees, note: chosen every turn }
  - { id: may, label: What it may touch, note: bounded per action }
  - { id: reach, label: Where it runs, note: with or without a person }
layers:
  - id: adapter
    label: Model adapter
    zone: run
    summary: Each model expects its own tool and thinking format
  - id: loop
    label: Agent loop
    zone: run
    summary: The model was trained on some loops and not others
  - id: tools
    label: Tools and MCP
    zone: run
    summary: Every tool costs context and muddies the choice
  - id: context
    label: Context
    zone: sees
    summary: The window is finite, and recall fades as it fills
  - id: memory
    label: Memory and state
    zone: sees
    summary: Whatever survives a window is re-read every session
  - id: permissions
    label: Permissions and sandbox
    zone: may
    summary: Blast radius grows with access, and prompts get approved
  - id: subagents
    label: Subagents
    zone: may
    summary: Fresh windows multiply tokens, and parallel writers disagree
  - id: surfaces
    label: Surfaces and channels
    zone: reach
    summary: Approvals need a person where the agent runs
  - id: schedule
    label: Schedule and always-on
    zone: reach
    summary: Nobody is watching, so failures stay quiet
rails:
  - { id: evals, label: Evals, from: adapter, to: subagents, summary: "One model, 8.7 points apart by harness", href: "#same-model-different-harness-different-score" }
  - { id: traces, label: Traces, from: adapter, to: schedule, summary: "Agent spans are still a draft standard", href: "#what-breaks-at-the-joins" }
