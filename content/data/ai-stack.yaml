# AI stack span chart data. Hand-editable; asOf is the date the placements were checked.
#
# To add a company, append a block under `companies:` (order does not matter):
#   id        kebab-case, unique, stable (the logo file is named after it)
#   domain    the site's real domain, for logo lookup
#   primary   one layer id from `layers` (where the company is strongest)
#   also      other layer ids it sells into, [] if none
#   tags      model type for specialists: image | video | voice | world | robotics ([] for text/general)
#   featured  true to show in the chart's initial view
#   note      one plain sentence, under ~110 characters, no marketing words
#   status    optional: kind acquired | pending | licensed | shutdown, plus a short label (counterparty, year)
#   source    one URL that supports the placement or the status
#   valuation usdB (USD billions, null if unknown), basis (public | private | deal | parent | undisclosed | none), asOf (month), source,
#             optional display (label shown instead of the number, e.g. ">$1B" when only a floor is public)
# Keep status.kind honest: pending = agreed or reported but not closed.
asOf: 2026-10-12
zones:
  - { id: infrastructure, label: Infrastructure }
  - { id: models, label: Models }
  - { id: serving, label: Serving and product }
layers:
  - { id: power, label: Power and sites, short: Power, abbr: PWR, zone: infrastructure }
  - { id: chips, label: Chips and memory, short: Chips, abbr: CHP, zone: infrastructure }
  - { id: systems, label: Racks and networks, short: Racks, abbr: NET, zone: infrastructure }
  - { id: cloud, label: Cloud and capital, short: Cloud, abbr: CLD, zone: infrastructure }
  - { id: data, label: Data, short: Data, abbr: DAT, zone: models }
  - { id: pretraining, label: Pretraining, short: Pretrain, abbr: PRE, zone: models }
  - { id: post-training, label: Post-training, short: Post-train, abbr: PST, zone: models }
  - { id: inference, label: Inference, short: Inference, abbr: INF, zone: serving }
  - { id: control, label: Gateways and observability, short: Gateway, abbr: GWY, zone: serving }
  - { id: evals, label: Evals, short: Evals, abbr: EVL, zone: serving }
  - { id: harness, label: Harness, short: Harness, abbr: HRN, zone: serving }
  - { id: apps, label: Apps, short: Apps, abbr: APP, zone: serving }
# Size tiers by valuation in USD billions: public market cap, last private valuation, or deal price.
sizeTiers:
  - { id: large, label: Large, range: "$50B+", minB: 50 }
  - { id: mid, label: Mid, range: "$5–50B", minB: 5 }
  - { id: small, label: Small, range: "under $5B", minB: 0 }
# Rows with no usable figure (undisclosed, non-profit, or a unit of a larger company) go in this tier.
unsizedTier: { id: unsized, label: Not sized, range: "no public figure" }
